# Reusable UAT release workflow.
# One-time verified publication path for 0.5.101 documented transition release.
# It targets the already-green PR #836 merge commit exactly.
# Later releases: use Actions -> Publish verified UAT release -> Run workflow.
name: Publish verified UAT release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "New UAT version, e.g. 0.5.95"
        required: true
        type: string
      target_sha:
        description: "Optional tested main-branch commit SHA; blank = current main"
        required: false
        type: string
      release_notes:
        description: "Description of the verified release"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-uat-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release and verify successful CI
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/verified-uat-release-notes.md"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            VERSION="0.5.101"
            TARGET_SHA="cccfb8568e49fd41af0446bc520ea4ad080e53e8"
            cat > "$NOTES_FILE" <<'NOTES'
          ## 0.5.101 — Enterprise transition release

          This release is for servers still running **0.5.95 through 0.5.98**. It contains the enterprise updater introduced in 0.5.99/0.5.100 plus a complete one-time transition runbook.

          **Do not use the legacy CAS Upgrade button until the bridge below is completed.**
          Do not manually replace individual PHP files.

          ### 1. Go to the CAS application root

          Replace the example path with the actual CAS root:

          ```bash
          cd /path/to/CAS
          ```

          Confirm the directory:

          ```bash
          test -f admin/upgrade.php \
            && test -f lib/system_backup.php \
            && test -f scripts/system_upgrade.php \
            && echo "CAS ROOT CONFIRMED" \
            || echo "STOP - WRONG DIRECTORY"
          ```

          Continue only if the output is:

          ```text
          CAS ROOT CONFIRMED
          ```

          ### 2. Download the complete official 0.5.101 release archive

          ```bash
          VERSION="0.5.101"
          TMP="$(mktemp -d)"

          curl -fL \
            "https://github.com/khoppenworth/CAS2025/archive/refs/tags/${VERSION}.tar.gz" \
            -o "$TMP/cas-${VERSION}.tar.gz"

          tar -xzf "$TMP/cas-${VERSION}.tar.gz" -C "$TMP"

          SRC="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d -name 'CAS2025-*' | head -1)"

          test -n "$SRC" \
            && test -f "$SRC/scripts/bootstrap_enterprise_transition.php" \
            && echo "RELEASE PACKAGE READY" \
            || echo "STOP - RELEASE PACKAGE INVALID"
          ```

          Continue only if the output is:

          ```text
          RELEASE PACKAGE READY
          ```

          ### 3. Run the non-destructive preflight

          ```bash
          php "$SRC/scripts/bootstrap_enterprise_transition.php" \
            --root="$PWD" \
            --source-root="$SRC" \
            --check
          ```

          The check verifies the existing updater files, native MySQL/MariaDB tools, staging database privileges using only a throwaway database, target Git hashes, PHP syntax, and the absence of conflicting maintenance/jobs.

          The required final message is:

          ```text
          CHECK PASSED. No live application files were changed.
          ```

          If the check does not finish with that exact message, **stop**. Do not run `--apply`.

          ### 4. Apply the one-time bridge

          Only after the check passes:

          ```bash
          php "$SRC/scripts/bootstrap_enterprise_transition.php" \
            --root="$PWD" \
            --source-root="$SRC" \
            --apply
          ```

          The bridge creates a rollback snapshot, atomically installs only the updater/runtime files, preserves owner/group/mode, verifies installed hashes and PHP syntax, leaves the active database unchanged, leaves installed-release metadata unchanged, and restores all original updater files automatically if a post-install verification fails.

          The required final message is:

          ```text
          BRIDGE INSTALLATION PASSED.
          ```

          If it reports an error, stop. Do not retry or manually replace files.

          ### 5. Verify CAS before the normal upgrade

          Open CAS and confirm:

          - login works;
          - dashboard loads normally;
          - images/assets load normally;
          - **Admin > System Upgrade** opens;
          - CAS still reports the old installed version, for example **0.5.95**.

          That is expected. The bridge upgrades only the updater/recovery runtime.

          ### 6. Upgrade normally through CAS

          In the web interface:

          1. Open **Admin > System Upgrade**.
          2. Click **Check for Updates**.
          3. Confirm **0.5.101** is offered.
          4. Start the upgrade.
          5. Do not launch another backup/upgrade/restore while the system job is active.

          From this point, long-running work executes as a background job. The live database is not dropped in place. CAS creates a native verified backup, restores it to an isolated candidate database, validates the candidate, stages/migrates the new release, enters a short maintenance window for cutover, and retains the previous database for rollback.

          ### 7. Post-upgrade verification

          Confirm:

          ```text
          [ ] CAS reports 0.5.101
          [ ] login works
          [ ] dashboard loads
          [ ] images/assets load
          [ ] users are present
          [ ] assessments load
          [ ] analytics loads
          [ ] Admin > System Upgrade loads
          [ ] no maintenance message remains
          ```

          Then create a **new Full Backup** in System Upgrade. It should run as a background job. After completion, download the already-created validated backup separately.

          ### If anything fails

          Do not immediately retry a failed system operation. Read the job/bridge error first. The bridge is fail-closed and restores the original updater files on failed post-install verification. Failures before enterprise cutover leave the active database untouched.

          Keep your independent application-folder copy and database dump until this transition, upgrade, backup, and restore path has been successfully exercised on the test server.

          The same instructions are included in the release archive as **ENTERPRISE_TRANSITION.md**.

          Transition hardening PR: #835  
          Runbook PR: #836
          NOTES
          else
            VERSION="$INPUT_VERSION"
            TARGET_SHA="${INPUT_TARGET_SHA:-$(git rev-parse origin/main)}"
            if [[ -z "$INPUT_RELEASE_NOTES" ]]; then
              echo "::error::Release notes must not be empty."
              exit 1
            fi
            printf '%s\n' "$INPUT_RELEASE_NOTES" > "$NOTES_FILE"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use N.N.N, e.g. 0.5.95."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Target must be a complete 40-character commit SHA."
            exit 1
          fi
          if ! git cat-file -e "${TARGET_SHA}^{commit}"; then
            echo "::error::Target commit does not exist locally."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::Target commit is not in main branch history."
            exit 1
          fi

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; no changes made."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists without a release; will not overwrite it."
            exit 1
          fi

          # An existing successful push-to-main CI run must test the EXACT release SHA.
          CI_PASSED="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .event == "push" and .head_branch == "main" and .conclusion == "success")] | length')"
          if [[ "$CI_PASSED" -lt 1 ]]; then
            echo "::error::No successful push-to-main CI workflow was found for $TARGET_SHA."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Ready: $VERSION from tested main-branch commit $TARGET_SHA."

      - name: Publish and verify GitHub Release
        if: steps.validate.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.validate.outputs.version }}
          TARGET_SHA: ${{ steps.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Release UAT $VERSION" \
            --notes-file "$RUNNER_TEMP/verified-uat-release-notes.md"

          TAG_TARGET="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha')"
          if [[ "$TAG_TARGET" != "$TARGET_SHA" ]]; then
            echo "::error::Published tag does not point to the verified target commit."
            exit 1
          fi
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'
          echo "Published and verified release $VERSION at $TARGET_SHA."
