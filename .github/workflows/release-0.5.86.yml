name: Publish UAT 0.5.86

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-0.5.86.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.5.86 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 0.5.86 already exists."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Location and GIS analytics for UAT

          - Adds configurable EPSS Location Management for 1 HQ and 19 independent hubs.
          - Keeps Addis Ababa Hub 1 and Addis Ababa Hub 2 as separate physical locations.
          - Adds Work Location / Duty Station selection for staff and administrator assignment.
          - Adds address/reference, latitude/longitude, verification status, active/inactive lifecycle, notes, and audit history.
          - Seeds the supplied hub coordinates as Estimated; HQ remains without invented coordinates until verified.
          - Adds GIS analytics with location filters, staff assessed, actual average competency score, and staff meeting the ≥80% target.
          - Keeps location independent from questionnaire assignment and visibility logic.
          - Adds `migration_locations.sql` for existing installations.
          - Existing users are not blocked if duty station is not yet populated.

          QA: PR CI and post-merge main CI both passed PHP lint and the MySQL smoke test.

          Pull request: #818
          EOF
          gh release create 0.5.86 \
            --repo "$GITHUB_REPOSITORY" \
            --target "250246188a1702d408969b5c4dde30a83b823dd8" \
            --title "Release UAT 0.5.86" \
            --notes-file /tmp/release-notes.md
