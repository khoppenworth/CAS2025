name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Ensure native MySQL client tools
        run: |
          if ! command -v mysqldump >/dev/null 2>&1 || ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y default-mysql-client
          fi
          mysqldump --version
          mysql --version
      - name: PHP lint
        run: make lint
      - name: Demo dataset SQL contract
        run: php tests/demo_dataset_sql_test.php
      - name: MySQL demo number generator regression
        env:
          DEMO_DB_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          DEMO_DB_USER: root
          DEMO_DB_PASS: root
        run: php tests/demo_dataset_sql_test.php --mysql
      - name: Verified backup/restore stress x3 (MySQL)
        env:
          BACKUP_DB_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          BACKUP_DB_USER: root
          BACKUP_DB_PASS: root
        run: |
          set -e
          for i in 1 2 3; do
            echo "MySQL backup/restore stress pass $i/3"
            BACKUP_DB_NAME="cas_system_backup_test_$i" php tests/system_backup_restore_test.php --mysql
          done
      - name: Detached system job launcher regression
        env:
          JOB_DB_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          JOB_DB_USER: root
          JOB_DB_PASS: root
          JOB_DB_NAME: cas_system_job_test
        run: php tests/system_job_launcher_test.php
      - name: MySQL smoke test
        run: mysql -h 127.0.0.1 -uroot -proot -e "SHOW DATABASES;"

  mariadb-demo-seed:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Ensure native MariaDB client tools
        run: |
          if ! command -v mariadb-dump >/dev/null 2>&1 || ! command -v mariadb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mariadb-client
          fi
          mariadb-dump --version
          mariadb --version
      - name: MariaDB 10.11 demo number generator regression
        env:
          DEMO_DB_DSN: mysql:host=127.0.0.1;port=3307;charset=utf8mb4
          DEMO_DB_USER: root
          DEMO_DB_PASS: root
        run: php tests/demo_dataset_sql_test.php --mysql
      - name: Verified backup/restore stress x3 (MariaDB 10.11)
        env:
          BACKUP_DB_DSN: mysql:host=127.0.0.1;port=3307;charset=utf8mb4
          BACKUP_DB_USER: root
          BACKUP_DB_PASS: root
        run: |
          set -e
          for i in 1 2 3; do
            echo "MariaDB backup/restore stress pass $i/3"
            BACKUP_DB_NAME="cas_system_backup_test_$i" php tests/system_backup_restore_test.php --mysql
          done
