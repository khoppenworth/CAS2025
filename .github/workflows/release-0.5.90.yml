name: Publish UAT 0.5.90

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-0.5.90.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.5.90 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 0.5.90 already exists."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Demo dataset MariaDB department staging hotfix

          - Fixes `SQLSTATE[HY000] ... 1137 Can't reopen table: tmp_demo_departments` when enabling the demo dataset.
          - Separates the temporary department count from the fallback insert so the insert no longer reads the same temporary table.
          - Adds a static regression that scans all demo temporary-table inserts for self-read/write patterns.
          - Expands database regression coverage to execute the department staging/fallback block with both an empty and populated department catalog.
          - Validated against MySQL 8 and MariaDB 10.11.
          - Retains the analytics-rich demo dataset from 0.5.88/0.5.89 with 80 synthetic staff, location coverage, 2024–2028 trends, and granular response items.
          - No database migration is required.

          QA: PR #822 and post-merge main CI passed PHP lint, SQL contract checks, MySQL 8 regression, and MariaDB 10.11 regression including the department staging block.

          Pull request: #822
          EOF
          gh release create 0.5.90 \
            --repo "$GITHUB_REPOSITORY" \
            --target "a862f4c3fb372316e214024bd35b39254048d08f" \
            --title "Release UAT 0.5.90" \
            --notes-file /tmp/release-notes.md
