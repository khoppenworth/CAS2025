name: Publish UAT 0.5.88

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-0.5.88.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.5.88 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 0.5.88 already exists."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Full analytics demo dataset for UAT

          - Expands the Admin → Settings demo dataset to 80 synthetic staff plus one supervisor.
          - Distributes demo staff across all active EPSS work locations, including HQ and all hubs.
          - Adds 2024–2028 assessment history with varied scores, visible gaps, and an improving trend.
          - Populates granular questionnaire response-item answers so Capacity Areas & Gaps, section scoring, heatmaps, Questionnaire Analysis, and detailed exports have usable synthetic data.
          - Covers departments, teams, work roles, gender, job grades, education, experience bands, profile roles, and business roles.
          - Keeps the EPSS location master and GIS coordinates read-only; demo cleanup removes only demo/dummy records.
          - Adds a regression contract test and updated demo-data documentation.
          - No new database migration is required beyond the location schema already introduced in 0.5.86.

          QA: PR #820 CI and post-merge main CI both passed PHP lint and the MySQL smoke test.

          Pull request: #820
          EOF
          gh release create 0.5.88 \
            --repo "$GITHUB_REPOSITORY" \
            --target "e40ad78b159fa28808eb40917e9f2ec368a2aef6" \
            --title "Release UAT 0.5.88" \
            --notes-file /tmp/release-notes.md
